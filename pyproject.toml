[project]
name = "surge"
version = "0.1.0"
description = "Surge — Personal Automation Hub (investment_scanner MVP)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Surge" }]
dependencies = [
    "pydantic-settings>=2.4",
    "pydantic>=2.8",
    "yfinance>=0.2.40",
    "requests>=2.32",
    "APScheduler>=3.10",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "black>=24.0",
    "mypy>=1.11",
]

[project.scripts]
surge = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict = false

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
skip_covered = false
